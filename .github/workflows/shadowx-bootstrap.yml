name: ShadowX bootstrap and build

on:
  push:
    paths:
      - ".github/workflows/shadowx-bootstrap.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "launcher/**"
      - "crates/cargo-horizon-mod/**"
      - "packaging/android/**"
      - "packaging/linux/**"
      - "packaging/macos/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shadowx-bootstrap-${{ github.sha }}
  cancel-in-progress: false

jobs:
  import-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout ShadowX
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config cmake ninja-build clang libclang-dev             libasound2-dev libudev-dev libx11-dev libxi-dev libxcursor-dev libxrandr-dev             libxinerama-dev libxkbcommon-dev libwayland-dev libvulkan-dev mesa-vulkan-drivers             libgtk-3-dev libssl-dev libdbus-1-dev libpipewire-0.3-dev libpulse-dev

      - name: Import Starling source while preserving upstream notices
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Import exactly once; never overwrite later ShadowX changes.
          if [ ! -f Cargo.toml ]; then
            git clone --depth 1 --branch starling https://github.com/starling-client/starling.git /tmp/starling
            rsync -a --exclude='.git' --exclude='.github' /tmp/starling/ ./
          fi
          mkdir -p .github/workflows
          if [ ! -f SHADOWX_SCOPE.md ]; then
          cat > README.md <<'EOF'
          # ShadowX

          ShadowX is an independent launcher/client project built from the Starling codebase,
          with Horizon upstream compatibility work. Original licenses and third-party notices
          are retained in the source tree. See `LICENSE`, `NOTICE`, and third-party license files.

          ## Project status

          The source bootstrap is in progress. A successful CI job is not a claim of complete
          Android/Desktop support; platform builds and runtime tests are tracked separately.

          ## Development

          - Rust workspace: Cargo workspace at the repository root.
          - CI: GitHub Actions.
          - Android: native Android target; requires Android SDK/NDK and device testing.
          EOF
          cat > SHADOWX_SCOPE.md <<'EOF'
          # ShadowX engineering scope

          This repository starts from Starling's Rust client implementation. Horizon is treated
          as an upstream/reference source; the two repositories are not blindly overlaid because
          Starling already contains a synchronization merge and project-specific changes.

          ## Targets
          - Preserve the upstream engine and all applicable license/copyright notices.
          - Rebrand only after identifying the actual app metadata, package identifiers, icons,
            launcher resources, and platform-specific manifests.
          - Maintain Android and desktop targets independently, sharing engine code where supported.
          - Keep Microsoft authentication and legitimate offline/local profiles as separate modes.
          - Preserve multiplayer authentication requirements; offline profiles do not bypass online-mode
            server authentication or game ownership checks.
          - Build a ShadowX mod SDK only against stable engine APIs. Prefer sandboxed WASM for
            portable user mods; native Rust extensions require platform-specific builds and review.
          - Import Mojo control layouts only through a documented compatibility adapter; do not assume
            its private/runtime formats are interchangeable with Starling controls.
          - Do not claim platform support until its CI build and runtime smoke test pass.
          EOF
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Bootstrap ShadowX from Starling source"
            # The branch can move while the large upstream tree is being imported.
            # Rebase the import commit onto the latest repository tip before pushing.
            for attempt in 1 2 3; do
              git fetch origin "${GITHUB_REF_NAME}"
              if git rebase "origin/${GITHUB_REF_NAME}"; then
                if git push origin "HEAD:${GITHUB_REF_NAME}"; then
                  break
                fi
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "Unable to push imported source after 3 retries" >&2
                exit 1
              fi
              git rebase --abort || true
              sleep 5
            done
          fi

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Record toolchain and workspace metadata
        run: |
          rustc --version
          cargo --version
          cargo metadata --no-deps --format-version 1 > shadowx-cargo-metadata.json

      - name: Formatting check
        run: cargo fmt --all -- --check

      - name: Workspace check
        run: cargo check --workspace

      - name: Check ShadowX Mod SDK executable
        run: cargo check -p cargo-horizon-mod --bin cargo-shadowx-mod

      - name: Compile Mod SDK tests
        run: cargo test -p cargo-horizon-mod --no-run
 
      - name: Check desktop launcher workspace
        run: |
          cargo fmt --manifest-path launcher/Cargo.toml --all -- --check
          cargo check --manifest-path launcher/Cargo.toml

      - name: Install Android Java toolchain
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Install pinned Android SDK components
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;35.0.0" "ndk;28.2.13676358"

      - name: Install Android Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
          components: rust-src

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build ShadowX Android ARM64 development APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/28.2.13676358
          RUSTC_BOOTSTRAP: "1"
        run: python3 packaging/android/build_apk.py --dev --abi arm64-v8a

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: shadowx-android-arm64-dev
          path: target/android/*.apk
          if-no-files-found: error
          retention-days: 14
  desktop-build:
    name: Desktop build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    steps:
      - name: Checkout ShadowX
        uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config cmake clang libclang-dev \
            libasound2-dev libudev-dev libx11-dev libxi-dev libxcursor-dev libxrandr-dev \
            libxinerama-dev libxkbcommon-dev libwayland-dev libvulkan-dev mesa-vulkan-drivers \
            libgtk-3-dev libssl-dev libdbus-1-dev libpipewire-0.3-dev libpulse-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache launcher dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            launcher -> launcher/target

      - name: Build ShadowX desktop launcher
        run: cargo build --locked --release --manifest-path launcher/Cargo.toml

      - name: Upload desktop launcher
        uses: actions/upload-artifact@v4
        with:
          name: shadowx-desktop-${{ matrix.os }}
          path: |
            launcher/target/release/horizon-launcher
            launcher/target/release/horizon-launcher.exe
          if-no-files-found: error
          retention-days: 14
  android-compat-build:
    name: Android APK (${{ matrix.abi }})
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: armeabi-v7a
            rust-target: armv7-linux-androideabi
          - abi: x86
            rust-target: i686-linux-android
          - abi: x86_64
            rust-target: x86_64-linux-android
    steps:
      - name: Checkout ShadowX
        uses: actions/checkout@v4

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config cmake ninja-build clang libclang-dev \
            libasound2-dev libudev-dev libx11-dev libxi-dev libxcursor-dev libxrandr-dev \
            libxinerama-dev libxkbcommon-dev libwayland-dev libvulkan-dev mesa-vulkan-drivers \
            libgtk-3-dev libssl-dev libdbus-1-dev libpipewire-0.3-dev libpulse-dev

      - name: Install Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Android SDK and NDK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;35.0.0" "ndk;28.2.13676358"

      - name: Install Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}
          components: rust-src

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build ShadowX Android APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/28.2.13676358
          RUSTC_BOOTSTRAP: '1'
        run: python3 packaging/android/build_apk.py --dev --abi ${{ matrix.abi }}

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: shadowx-android-${{ matrix.abi }}
          path: target/android/shadowx-dev-0.1.0-${{ matrix.abi }}.apk
          if-no-files-found: error
          retention-days: 14
