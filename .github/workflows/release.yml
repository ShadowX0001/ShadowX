name: ShadowX release builds

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shadowx-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  desktop:
    name: Desktop release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            archive: tar.gz
            binary: horizon-launcher
          - os: windows-latest
            archive: zip
            binary: horizon-launcher.exe
          - os: macos-latest
            archive: tar.gz
            binary: horizon-launcher
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config cmake clang libclang-dev \
            libasound2-dev libudev-dev libx11-dev libxi-dev libxcursor-dev libxrandr-dev \
            libxinerama-dev libxkbcommon-dev libwayland-dev libvulkan-dev mesa-vulkan-drivers \
            libgtk-3-dev libssl-dev libdbus-1-dev libpipewire-0.3-dev libpulse-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache launcher dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            launcher -> launcher/target

      - name: Build desktop launcher
        run: cargo build --release --manifest-path launcher/Cargo.toml

      - name: Package Windows launcher
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Copy-Item "launcher/target/release/${{ matrix.binary }}" release-assets/
          Compress-Archive -Path "release-assets/${{ matrix.binary }}" -DestinationPath "release-assets/ShadowX-Windows-x64.zip"
          Remove-Item "release-assets/${{ matrix.binary }}"

      - name: Package Unix launcher
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p release-assets
          tar -C launcher/target/release -czf "release-assets/ShadowX-${{ matrix.os }}.tar.gz" "${{ matrix.binary }}"

      - name: Upload desktop release asset
        uses: actions/upload-artifact@v4
        with:
          name: shadowx-desktop-${{ matrix.os }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  android-arm64:
    name: Android ARM64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Install Android SDK and NDK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;35.0.0" "ndk;28.2.13676358"

      - name: Install Rust and Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
          components: rust-src

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build signed development-key APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/28.2.13676358
          RUSTC_BOOTSTRAP: "1"
        run: python3 packaging/android/build_apk.py --profile release --abi arm64-v8a

      - name: Stage Android APK
        run: |
          mkdir -p release-assets
          cp target/android/shadowx-0.1.0-arm64-v8a.apk release-assets/ShadowX-Android-arm64-v8a.apk

      - name: Upload Android release asset
        uses: actions/upload-artifact@v4
        with:
          name: shadowx-android-arm64
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: [desktop, android-arm64]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform assets
        uses: actions/download-artifact@v4
        with:
          pattern: shadowx-*
          path: release-assets
          merge-multiple: true

      - name: Verify release assets exist
        run: |
          test -n "$(find release-assets -maxdepth 1 -type f -print -quit)"
          find release-assets -maxdepth 1 -type f -printf '%f %s bytes\n'

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
